name: ERICA 메뉴 갱신 및 배포

on:
  push:
    branches: [main]
  schedule:
    # 한국시간 07~08시, 10~12시, 16~18시에 30분 간격 확인
    # 정각 혼잡을 피하려고 매시 07분과 37분에 실행
    - cron: "7,37 22-23,1-3,7-9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 오늘 메뉴 수집
        run: python3 scripts/fetch_menu.py

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      - name: 정적 페이지 묶기
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
