        ticking = true;

  window.__SIDEBAR_RENDERED_BY_PHP__ = true;

  // 햄버거 메뉴 ↔ 사이드바 토글
  (function () {
    var hamburger = document.getElementById('btn-hamburger');
    var sidebar = document.getElementById('site-sidebar');
    var overlay = document.getElementById('site-sidebar-overlay');
    var closeBtn = document.getElementById('btn-sidebar-close');

    function openSidebar() {
      sidebar.classList.add('is-open');
      overlay.classList.add('is-active');
      hamburger.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }

    function closeSidebar() {
      sidebar.classList.remove('is-open');
      overlay.classList.remove('is-active');
      hamburger.setAttribute('aria-expanded', 'false');
      if (window.innerWidth < 1024) document.body.style.overflow = '';
    }

    // PC 모드(≥1024px): 사이드바 항상 반응하도록 스크롤 고정
    function applyPcScrollLock() {
      if (window.innerWidth >= 1024) {
        document.body.style.overflow = 'hidden';
      } else {
        document.body.style.overflow = '';
      }
    }
    applyPcScrollLock();
    window.addEventListener('resize', applyPcScrollLock);

    if (hamburger) hamburger.addEventListener('click', openSidebar);
    if (overlay) overlay.addEventListener('click', closeSidebar);
    if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
  })();
</script>

            }
            
            let locText = f.location || '';
            let locHtml = locText ? `<div style="color: var(--hy-color-brand-blue, #003b70); font-size: 0.75rem; font-weight: 600; text-align: center; margin-bottom: 2px;">${locText}</div>` : '';

            html += `
              <a href="${href}" class="fac-banner-item">
                <div class="fac-banner-img" style="${imgStyle}">${icon}</div>
                <div style="padding: 12px 8px; background: #fff;">
                  ${locHtml}
                  <div class="fac-banner-name" style="padding: 0;">${shopName}</div>
                </div>
              </a>`;
          });
          html += `</div></div>`;
        });
        facGridContainer.innerHTML = html;
      } else if (facGridContainer) {
        facGridContainer.innerHTML = `<div class="hy-empty-state hy-section--no-border">등록된 글이 없습니다.</div>`;
      }

    });
  </script>
</body>

</html>
